name: Seguimiento SEO Search Console
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  informe-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de API de Google
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Analizar consultas y preparar informe
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: https://alaezprocurador.github.io/procurador-leon/
        run: python scripts/informe_seo.py
      - name: Conservar informe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-seo
          path: seo/informes/ultimo-informe.md
          retention-days: 90
